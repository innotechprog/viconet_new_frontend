<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-fav.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%PAGE_TITLE%</title>
    <meta
      name="description"
      content="vico.net connects skilled professionals with businesses worldwide. Build your talent profile, find verified opportunities, explore blogs and webinars, and grow your career or team on one trusted platform."
    />
    <meta
      name="keywords"
      content="vico.net, talent platform, hire talent, remote jobs, professional network, career growth, skills-based hiring, business hiring, verified jobs, webinars, podcasts"
    />
    <meta name="author" content="vico.net" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="theme-color" content="#060628" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="vico.net" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta
      property="og:description"
      content="Digital ecosystem for professionals and businesses: discover talent, verified opportunities, learning resources, and global collaboration on vico.net."
    />
    <meta property="og:image" content="%SITE_URL%/images/blog-future-work.png" />
    <meta property="og:image:alt" content="Professional working on a laptop — vico.net talent ecosystem" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%SITE_URL%/" />
    <meta
      name="twitter:title"
      content="vico.net — Where Talent Meets Opportunity"
    />
    <meta
      name="twitter:description"
      content="Connect with top talent and leading businesses. Profiles, verified opportunities, blogs, webinars &amp; more."
    />
    <meta name="twitter:image" content="%SITE_URL%/images/blog-future-work.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
